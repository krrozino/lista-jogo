name: Publicar release beta
on:
  push:
    branches: [main]
    tags:
      - 'v0.*-alpha.*'
      - 'v0.*-beta.*'
      - 'v0.*-rc.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão exata de package.json, sem v'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: lista-beta-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'krrozino/lista-jogo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar catálogo, fontes e dados offline
        run: |
          node scripts/check-catalog.cjs
          node --check src/quiz.js
          node --check src/journey.js
      - name: Validar tag, versão e notas
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || { echo 'Apenas versões beta 0.x!'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF_NAME" == 'main' && "$MANUAL_VERSION" == "$VERSION" ]] || exit 1
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || exit 1
          else
            [[ "$GITHUB_REF_NAME" == 'main' ]] || exit 1
          fi
          [[ -s "releases/v$VERSION.md" ]] || { echo 'Notas de release não encontradas.'; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Validar a referência da versão, se existir
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "A versão $TAG já está publicada em outro commit. Escolha nova beta.N." >&2
            exit 1
          fi
      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "LISTA! $TAG (Beta)" --notes-file "releases/$TAG.md" --prerelease
