name: Publicar release beta

on:
  push:
    tags:
      - 'v0.*-alpha.*'
      - 'v0.*-beta.*'
      - 'v0.*-rc.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Versão exata de package.json (ex.: 0.4.1-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lista-beta-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'krrozino/lista-jogo'
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar versão, referência e notas
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^0\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Somente versões beta/alpha/rc 0.x.y são permitidas." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "Use a branch main."; exit 1; }
            [[ "$MANUAL_VERSION" == "$VERSION" ]] || { echo "Versão não corresponde a package.json."; exit 1; }
          else
            [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Tag e package.json divergentes."; exit 1; }
          fi
          [[ -s "releases/v$VERSION.md" ]] || { echo "Notas de release ausentes."; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Criar tag na execução manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$EXISTING" ]]; then
            [[ "$EXISTING" == "$GITHUB_SHA" ]] || { echo "Tag existente aponta para outro commit; não será movida."; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Criar GitHub Release pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release já publicada para $TAG."
            exit 0
          fi
          gh release create "$TAG" \
            --title "LISTA! $TAG (Beta)" \
            --notes-file "releases/$TAG.md" \
            --prerelease \
            --verify-tag
